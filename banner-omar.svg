
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="320"
     viewBox="0 0 1280 320">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101E32"/>
      <stop offset="55%" stop-color="#0B1423"/>
      <stop offset="100%" stop-color="#080F1B"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F06445"/>
      <stop offset="100%" stop-color="#526A82"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#253950" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#142338" stop-opacity=".4"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36"
            fill="none"
            stroke="#8CA0B4"
            stroke-opacity=".07"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#background)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Geometric accents -->
  <path d="M0 0H210L0 210Z" fill="#526A82" opacity=".12"/>
  <path d="M1280 320H1110L1280 150Z" fill="#526A82" opacity=".12"/>

  <!-- Decorative architecture lines -->
  <g fill="none" stroke="#526A82" stroke-width="2" opacity=".5">
    <path d="M880 60H1120V105H1240"/>
    <path d="M840 250H1030V205H1190"/>
    <path d="M1080 0V60"/>
    <path d="M1200 105V205"/>
    <path d="M1000 250V300"/>
  </g>

  <g fill="#F06445">
    <circle cx="880" cy="60" r="5"/>
    <circle cx="1240" cy="105" r="5"/>
    <circle cx="1030" cy="205" r="5"/>
    <circle cx="1000" cy="250" r="5"/>
  </g>

  <!-- Application window -->
  <rect x="905" y="85"
        width="285" height="130"
        rx="12"
        fill="url(#panel)"
        stroke="#526A82"
        stroke-opacity=".75"
        stroke-width="2"/>

  <g fill="#8CA0B4" opacity=".8">
    <circle cx="925" cy="104" r="5"/>
    <circle cx="943" cy="104" r="5"/>
    <circle cx="961" cy="104" r="5"/>
  </g>

  <rect x="925" y="123" width="74" height="61"
        rx="6" fill="#526A82" opacity=".55"/>

  <g fill="#8CA0B4" opacity=".55">
    <rect x="1015" y="128" width="145" height="9" rx="4"/>
    <rect x="1015" y="148" width="120" height="9" rx="4"/>
    <rect x="1015" y="168" width="95" height="9" rx="4"/>
  </g>

  <!-- Secondary architecture panel -->
  <rect x="945" y="235"
        width="190" height="52"
        rx="8"
        fill="#192B40"
        stroke="#526A82"
        stroke-opacity=".6"/>

  <g fill="#526A82">
    <rect x="965" y="253" width="38" height="16" rx="3"/>
    <rect x="1021" y="253" width="38" height="16" rx="3"/>
    <rect x="1077" y="253" width="38" height="16" rx="3"/>
  </g>

  <!-- Database -->
  <g transform="translate(1190 240)" opacity=".85">
    <ellipse cx="0" cy="0" rx="32" ry="10" fill="#526A82"/>
    <path d="M-32 0V38C-32 50 32 50 32 38V0"
          fill="#263B52"/>
    <path d="M-32 18C-32 30 32 30 32 18"
          fill="none" stroke="#8CA0B4" stroke-opacity=".5"/>
    <ellipse cx="0" cy="38" rx="32" ry="10" fill="#263B52"/>
  </g>

  <!-- Main identity -->
  <text x="76" y="125"
        fill="#F2F0E9"
        font-family="Inter, Arial, sans-serif"
        font-size="76"
        font-weight="800"
        letter-spacing="1">
    OMAR TORRES
  </text>

  <text x="79" y="181"
        fill="#F06445"
        font-family="Inter, Arial, sans-serif"
        font-size="30"
        font-weight="700"
        letter-spacing="2">
    FULL STACK LARAVEL DEVELOPER
  </text>

  <rect x="79" y="207" width="650" height="4"
        rx="2" fill="url(#accent)"/>

  <text x="79" y="252"
        fill="#D3D9E1"
        font-family="Inter, Arial, sans-serif"
        font-size="22"
        font-weight="400">
    Aplicaciones web sólidas para problemas reales.
  </text>

  <!-- Small signature -->
  <text x="80" y="291"
        fill="#8CA0B4"
        font-family="Inter, Arial, sans-serif"
        font-size="11"
        letter-spacing="3">
    PHP  /  LARAVEL  /  WEB DEVELOPMENT
  </text>

</svg>
